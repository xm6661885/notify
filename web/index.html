<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F6F2E7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1F1D1A" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Notify" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Notify</title>
    <style>
      /* Splash shown until the bundle boots; matches the in-app .boot screen. */
      #splash { position: fixed; inset: 0; display: grid; place-items: center; background: #F6F2E7; z-index: 100; }
      #splash svg { width: 64px; animation: splash-breathe 1.4s ease-in-out infinite; }
      @keyframes splash-breathe { 0%, 100% { transform: scale(0.94); opacity: 0.75; } 50% { transform: scale(1.04); opacity: 1; } }
      @media (prefers-color-scheme: dark) { #splash { background: #1F1D1A; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-label="Loading">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="#fbc7d1" opacity="0.35" />
        <path d="M32 12c-8.3 0-14 6.4-14 14.6v8.6c0 2.4-1.2 4.6-3.2 6L13.5 42c-1 .7-.5 2.3.7 2.3h35.6c1.2 0 1.7-1.6.7-2.3l-1.3-.8c-2-1.4-3.2-3.6-3.2-6v-8.6C46 18.4 40.3 12 32 12Z" fill="#fbc7d1" stroke="#f3a7b7" stroke-width="2" />
        <circle cx="32" cy="49.5" r="4.2" fill="#f3a7b7" />
        <circle cx="32" cy="10.5" r="2.6" fill="#f3a7b7" />
      </svg>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
